<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지?</title>
</head>

<body style="text-align:center; font-family:sans-serif; padding-top:100px;">

  <h1>🍚 오늘 뭐 먹지?</h1>
  <p>버튼을 누르면 오늘의 점심 메뉴를 골라드립니다.</p>

  <button onclick="pickLunch()"
          style="font-size:20px; padding:15px 30px; cursor:pointer;">
    🎲 메뉴 뽑기
  </button>

  <h2 id="result" style="margin-top:40px;"></h2>

  <script>
    function pickLunch() {
      const menus = [
        "🥟 만두",
"🍱 도시락",
"🥓 삼겹살",
        "🍲 김치찌개",
        "🍜 짬뽕",
        "🍛 카레",
        "🥩 제육볶음",
        "🍣 초밥",
        "🍔 햄버거",
        "🍝 파스타",
        "🍗 치킨",
        "🥘 순대국",
        "🍜 쌀국수"
      ];

      const random = Math.floor(Math.random() * menus.length);

      document.getElementById("result").innerText =
        "오늘의 점심은 " + menus[random] + "!";
    }
  </script>

</body>
</html>
