<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지?</title>
</head>

<body style="text-align:center; font-family:sans-serif; padding-top:80px;">

  <h1>🍚 오늘 뭐 먹지?</h1>
  <p>먹고 싶은 종류를 선택하세요.</p>

  <div style="margin-top:30px;">

    <button onclick="pickLunch('korean')"
            style="font-size:18px; padding:15px 25px; margin:5px; cursor:pointer;">
      🇰🇷 한식
    </button>

    <button onclick="pickLunch('chinese')"
            style="font-size:18px; padding:15px 25px; margin:5px; cursor:pointer;">
      🥟 중식
    </button>

    <button onclick="pickLunch('japanese')"
            style="font-size:18px; padding:15px 25px; margin:5px; cursor:pointer;">
      🍣 일식
    </button>

  </div>

  <h2 id="result" style="margin-top:40px;"></h2>

  <script>

    const menus = {

      korean: [
        "🍲 김치찌개",
        "🥩 제육볶음",
        "🥘 순대국",
        "🍚 비빔밥",
        "🥓 삼겹살",
        "🍲 된장찌개"
      ],

      chinese: [
        "🍜 짜장면",
        "🌶️ 짬뽕",
        "🥟 만두",
        "🍚 볶음밥",
        "🍖 탕수육",
        "🌶️ 마라탕"
      ],

      japanese: [
        "🍣 초밥",
        "🍜 라멘",
        "🍛 카레",
        "🍱 돈까스",
        "🍲 우동",
        "🍚 규동"
      ]

    };

    function pickLunch(type) {

      const selectedMenus = menus[type];

      const random =
        Math.floor(Math.random() * selectedMenus.length);

      document.getElementById("result").innerText =
        "오늘의 점심은 " + selectedMenus[random] + "!";

    }

  </script>

</body>
</html>
